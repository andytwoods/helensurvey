build_settings:
  build_image: dockerfile
  dockerfile_path: Dockerfile
  container_port: 8000
  environment_variables:
    - name: DATABASE_URL
      from_database:
        name: db
        property: private_connection_url
    # manage.py defaults to config.settings.local, so release.sh would migrate
    # against SQLite inside the container without this.
    - name: DJANGO_SETTINGS_MODULE
      value: "config.settings.production"
    # Required at runtime by config/settings/production.py (no default). The
    # copier only supplies this as a build-time dummy for collectstatic.
    - name: DJANGO_ADMIN_URL
      source: manual
    - name: ALLOWED_HOSTS
      source: manual
    - name: CSRF_TRUSTED_ORIGINS
      source: manual
    - name: DJANGO_SECRET_KEY
      source: manual
    - name: WEB_CONCURRENCY
      value: "2"

services:
  web:
    command: bash run.sh
  release:
    command: bash release.sh

databases:
  db:
    type: postgresql_18
